filters:
- header:
    comment: Basic services inbound
    targets:
      cisco: BASIC_DATA_SRVC_IN extended
      arista: BASIC_DATA_SRVC_IN
  terms:
    - name: accept-web-servers
      comment: Accept connections to our web servers
      destination-address: WEB_SERVERS
      destination-port: WEB
      protocol: tcp
      action: accept
    - name: default-deny
      comment: Deny anything else.
      action: deny
- include: policies/pol/dns.pol.yaml
- include: policies/pol/dhcp.pol.yaml
- header:
    comment: Basic services outbound
    targets:
      cisco: BASIC_DATA_SRVC_OUT mixed
      arista: BASIC_DATA_SRVC_OUT mixed
  terms:
    - name: default-accept
      action: accept
